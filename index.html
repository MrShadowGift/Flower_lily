<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цветок с подсветкой и мерцанием</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000;
            font-family: Arial, sans-serif;
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
        }
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .controls.hidden {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }
        .color-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .color-option:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .color-preview {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid white;
        }
        h3 {
            margin: 0 0 10px 0;
            color: #ffd700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .flicker-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .flicker-control input {
            margin: 0;
        }
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            z-index: 101;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }
        .toggle-btn:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }
        .reset-btn {
            background-color: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border: 1px solid #ffd700;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s;
        }
        .reset-btn:hover {
            background-color: rgba(255, 215, 0, 0.4);
        }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .color-grid::-webkit-scrollbar {
            width: 5px;
        }
        .color-grid::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="controls">
        
        <div class="color-grid">
            <div class="color-option" data-color="0xFFF5E1">
                <div class="color-preview" style="background-color: #FFF5E1;"></div>
                <span>Кремовый</span>
            </div>
            
            <div class="color-option" data-color="0xFFB6C1">
                <div class="color-preview" style="background-color: #FFB6C1;"></div>
                <span>Розовый</span>
            </div>
            
            <div class="color-option" data-color="0xE6E6FA">
                <div class="color-preview" style="background-color: #E6E6FA;"></div>
                <span>Лавандовый</span>
            </div>
            
            <div class="color-option" data-color="0x98FB98">
                <div class="color-preview" style="background-color: #98FB98;"></div>
                <span>Мятный</span>
            </div>
            
            <div class="color-option" data-color="0x87CEEB">
                <div class="color-preview" style="background-color: #87CEEB;"></div>
                <span>Голубой</span>
            </div>
            
            <div class="color-option" data-color="0xFF6347">
                <div class="color-preview" style="background-color: #FF6347;"></div>
                <span>Томатный</span>
            </div>
            
            <div class="color-option" data-color="0xFFD700">
                <div class="color-preview" style="background-color: #FFD700;"></div>
                <span>Золотой</span>
            </div>
            
            <div class="color-option" data-color="0xDA70D6">
                <div class="color-preview" style="background-color: #DA70D6;"></div>
                <span>Орхидея</span>
            </div>
            
            <div class="color-option" data-color="0x00FF7F">
                <div class="color-preview" style="background-color: #00FF7F;"></div>
                <span>Весенний зеленый</span>
            </div>
            
            <div class="color-option" data-color="0x1E90FF">
                <div class="color-preview" style="background-color: #1E90FF;"></div>
                <span>Синий Доджер</span>
            </div>
            
            <div class="color-option" data-color="0xFF4500">
                <div class="color-preview" style="background-color: #FF4500;"></div>
                <span>Красно-оранжевый</span>
            </div>
            
            <div class="color-option" data-color="0x8A2BE2">
                <div class="color-preview" style="background-color: #8A2BE2;"></div>
                <span>Сине-фиолетовый</span>
            </div>
            
            <div class="color-option" data-color="0xFF1493">
                <div class="color-preview" style="background-color: #FF1493;"></div>
                <span>Глубокий розовый</span>
            </div>
            
            <div class="color-option" data-color="0x00CED1">
                <div class="color-preview" style="background-color: #00CED1;"></div>
                <span>Бирюзовый</span>
            </div>
            
            <div class="color-option" data-color="0xFF8C00">
                <div class="color-preview" style="background-color: #FF8C00;"></div>
                <span>Темно-оранжевый</span>
            </div>
            
            <div class="color-option" data-color="0x7CFC00">
                <div class="color-preview" style="background-color: #7CFC00;"></div>
                <span>Зеленая лужайка</span>
            </div>
        </div>
        
        <div class="flicker-control">
            <input type="checkbox" id="flicker-toggle" checked>
            <label for="flicker-toggle">Эффект мерцания</label>
        </div>
    </div>

    <button class="toggle-btn" id="toggle-btn">☰</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Параметры цветка
        const params = {
            petalNum: 6,        // Количество лепестков: 6
            diameter: 100,
            pLength: 150,
            pSharpness: 0.4,
            flowerHeight: 300,
            curvature1: 0.8,
            curvature2: 0.2,
            bump: 2.5,
            bumpNum: 10
        };

        let scene, camera, renderer, controls;
        let flowerMesh;
        let rows = 60, cols = 120;
        
        // Переменные для управления цветом и мерцанием
        let currentColor = 0xFFF5E1; // Кремовый по умолчанию
        let flickerEnabled = true;
        let flickerIntensity = 0;
        let flickerSpeed = 0.05;
        
        // Сохраняем исходные параметры камеры
        const initialCameraPosition = { x: 0, y: 0, z: 500 };
        const initialCameraRotation = { x: 0, y: 0, z: 0 };
        
        function init() {
            // Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Камера
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = initialCameraPosition.z;
            
            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Управление камерой с автовращением
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            
            // Освещение для подсветки цветка
            const ambientLight = new THREE.AmbientLight(0xfffdd0, 0.9);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xfffdd0, 0.9);
            directionalLight.position.set(9, 9, 9);
            scene.add(directionalLight);
            
            // Точечный свет для усиления свечения
            const pointLight = new THREE.PointLight(0xfff5e1, 0.9, 1000);
            pointLight.position.set(0, 0, 100);
            scene.add(pointLight);
            
            // Создание цветка
            createFlower();
            
            // Настройка элементов управления
            setupControls();
            
            // Обработка изменения размера окна
            window.addEventListener('resize', onWindowResize);
            
            // Запуск анимации
            animate();
        }
        
        function createFlower() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];
            
            const pNum = params.petalNum; // Используем 6 лепестков
            const fD = params.diameter;
            const pLen = params.pLength;
            const pSharp = params.pSharpness;
            const fHeight = params.flowerHeight;
            const curve1 = params.curvature1;
            const curve2 = params.curvature2;
            const b = params.bump;
            const bNum = params.bumpNum;
            
            // Создаем вершины с исправленной формулой для 6 лепестков
            for(let theta = 0; theta < rows; theta++) {
                for(let phi = 0; phi < cols; phi++) {
                    // Исправленная формула для 6 лепестков
                    const angle = phi * 2 * Math.PI / cols;
                    const petalFactor = Math.abs(Math.sin(pNum * angle / 2));
                    
                    const r = (pLen * Math.pow(petalFactor, pSharp) + fD) * theta / rows;
                    const x = r * Math.cos(angle);
                    const y = r * Math.sin(angle);
                    const z = vShape(fHeight, r/100, curve1, curve2, 1.5) - 200 +
                        bumpiness(b, r/100, bNum, phi * 360/cols);
                    
                    vertices.push(x, y, z);
                    
                    // Цвет с легким градиентом
                    const baseColor = new THREE.Color(currentColor);
                    const saturation = 0.9 - theta * (0.7 / rows);
                    const color = baseColor.clone().multiplyScalar(saturation);
                    
                    colors.push(color.r, color.g, color.b);
                }
            }
            
            // Создаем индексы для треугольников
            const indices = [];
            for(let theta = 0; theta < rows - 1; theta++) {
                for(let phi = 0; phi < cols; phi++) {
                    const nextPhi = (phi + 1) % cols;
                    
                    // Первый треугольник
                    indices.push(theta * cols + phi);
                    indices.push((theta + 1) * cols + phi);
                    indices.push(theta * cols + nextPhi);
                    
                    // Второй треугольник
                    indices.push(theta * cols + nextPhi);
                    indices.push((theta + 1) * cols + phi);
                    indices.push((theta + 1) * cols + nextPhi);
                }
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();
            
            // Материал с эффектом свечения
            const material = new THREE.MeshPhongMaterial({
                vertexColors: true,
                side: THREE.DoubleSide,
                shininess: 10,
                emissive: 0x333300,
                emissiveIntensity: 0.6,
                transparent: true,
                opacity: 0.9
            });
            
            flowerMesh = new THREE.Mesh(geometry, material);
            scene.add(flowerMesh);
        }
        
        function setupControls() {
            // Обработчики для выбора цвета
            const colorOptions = document.querySelectorAll('.color-option');
            colorOptions.forEach(option => {
                option.addEventListener('click', function() {
                    const colorValue = parseInt(this.getAttribute('data-color'));
                    changeFlowerColor(colorValue);
                    
                    // Обновляем выделение
                    colorOptions.forEach(opt => opt.style.backgroundColor = 'transparent');
                    this.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
                });
            });
            
            // Выбираем первый цвет по умолчанию
            colorOptions[0].style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
            
            // Обработчик для переключателя мерцания
            const flickerToggle = document.getElementById('flicker-toggle');
            flickerToggle.addEventListener('change', function() {
                flickerEnabled = this.checked;
            });
            
            // Обработчик для кнопки сброса
            const resetBtn = document.getElementById('reset-btn');
            resetBtn.addEventListener('click', function() {
                resetCamera();
                // Также сбрасываем цвет на кремовый
                changeFlowerColor(0xFFF5E1);
                colorOptions.forEach(opt => opt.style.backgroundColor = 'transparent');
                colorOptions[0].style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
            });
            
            // Обработчик для кнопки переключения меню
            const toggleBtn = document.getElementById('toggle-btn');
            const controlsPanel = document.querySelector('.controls');
            toggleBtn.addEventListener('click', function() {
                controlsPanel.classList.toggle('hidden');
                toggleBtn.textContent = controlsPanel.classList.contains('hidden') ? '☰' : '✕';
            });
        }
        
        function changeFlowerColor(newColor) {
            currentColor = newColor;
            
            // Обновляем цвета вершин
            const colors = flowerMesh.geometry.attributes.color.array;
            const baseColor = new THREE.Color(newColor);
            
            for(let i = 0; i < colors.length; i += 3) {
                const theta = Math.floor((i/3) / cols) % rows;
                const saturation = 0.9 - theta * (0.7 / rows);
                const color = baseColor.clone().multiplyScalar(saturation);
                
                colors[i] = color.r;
                colors[i+1] = color.g;
                colors[i+2] = color.b;
            }
            
            flowerMesh.geometry.attributes.color.needsUpdate = true;
            
            // Также обновляем освещение для соответствия цвету
            updateLighting(newColor);
        }
        
        function updateLighting(color) {
            // Обновляем цвет освещения в соответствии с выбранным цветом цветка
            const colorObj = new THREE.Color(color);
            scene.children.forEach(child => {
                if (child.isLight) {
                    child.color = colorObj;
                    // Немного уменьшаем интенсивность для более ярких цветов
                    child.intensity = color === 0xFFF5E1 ? 0.9 : 0.7;
                }
            });
        }
        
        function resetCamera() {
            // Сброс позиции и поворота камеры
            camera.position.set(initialCameraPosition.x, initialCameraPosition.y, initialCameraPosition.z);
            camera.rotation.set(initialCameraRotation.x, initialCameraRotation.y, initialCameraRotation.z);
            controls.reset();
        }
        
        // Функции из оригинального кода
        function vShape(A, r, a, b, c) {
            return A * Math.pow(Math.E, -b * Math.pow(Math.abs(r), c)) * Math.pow(Math.abs(r), a);
        }
        
        function bumpiness(A, r, f, angle) {
            return 1 + A * Math.pow(r, 2) * Math.sin(f * angle * Math.PI/180);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Автоматическое вращение камеры
            controls.update();
            
            // Эффект мерцания
            if (flickerEnabled && flowerMesh) {
                flickerIntensity += flickerSpeed;
                const flickerValue = 0.4 + 0.3 * Math.sin(flickerIntensity);
                flowerMesh.material.emissiveIntensity = flickerValue;
                
                // Легкое изменение прозрачности для эффекта мерцания
                flowerMesh.material.opacity = 0.85 + 0.1 * Math.sin(flickerIntensity * 0.7);
            }
            
            renderer.render(scene, camera);
        }
        
        // Запуск приложения
        init();
    </script>
</body>
</html>
